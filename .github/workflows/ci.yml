name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Format, lint, and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y appstream desktop-file-utils libglib2.0-bin libsqlite3-dev pkg-config

      - name: Install Rust stable
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt clippy

      - name: Validate app metadata
        run: |
          appstreamcli validate data/io.github.moooossee.Moose.metainfo.xml.in
          desktop-file-validate data/io.github.moooossee.Moose.desktop
          glib-compile-schemas --strict --dry-run data

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint Rust
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --all-targets

  flatpak:
    name: Build Flatpak
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: moose.flatpak
          manifest-path: io.github.moooossee.Moose.yml
          cache-key: flatpak-builder-${{ github.sha }}
