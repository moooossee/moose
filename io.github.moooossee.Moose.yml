app-id: io.github.moooossee.Moose
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: moose
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/moose/cargo
finish-args:
  - --share=network
  - --share=ipc
  - --device=dri
  - --socket=fallback-x11
  - --socket=wayland
modules:
  - name: leptonica
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_SHARED_LIBS=ON
      - -DBUILD_PROG=OFF
      - -DSW_BUILD=OFF
    post-install:
      - install -Dm644 /run/build/leptonica/leptonica-license.txt /app/share/licenses/io.github.moooossee.Moose/leptonica/LICENSE
    cleanup:
      - /include
      - /lib/pkgconfig
      - /lib/cmake
    sources:
      - type: archive
        url: https://github.com/DanBloomberg/leptonica/releases/download/1.87.0/leptonica-1.87.0.tar.gz
        sha256: c73363397f96eb1295602bf44d708a994ad42046c791bf03ea0505d829bdb6a7
  - name: tesseract
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_SHARED_LIBS=ON
      - -DBUILD_TRAINING_TOOLS=OFF
      - -DBUILD_TESTS=OFF
      - -DOPENMP_BUILD=OFF
      - -DDISABLE_ARCHIVE=ON
      - -DDISABLE_CURL=ON
      - -DGRAPHICS_DISABLED=ON
      - -DENABLE_NATIVE=OFF
    post-install:
      - install -Dm644 /run/build/tesseract/LICENSE /app/share/licenses/io.github.moooossee.Moose/tesseract/LICENSE
      - install -Dm644 /run/build/tesseract/tessdata-LICENSE /app/share/licenses/io.github.moooossee.Moose/tessdata/LICENSE
    cleanup:
      - /include
      - /lib/pkgconfig
      - /lib/cmake
      - /share/man
    sources:
      - type: archive
        url: https://github.com/tesseract-ocr/tesseract/archive/refs/tags/5.5.4.tar.gz
        sha256: a8dbf8b8c8ee427ff6ad1d99116502feaf59440af1adb893caf60a6576826cf4
      - type: file
        url: https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/87416418657359cb625c412a48b6e1d6d41c29bd/LICENSE
        dest-filename: tessdata-LICENSE
        sha256: cfc7749b96f63bd31c3c42b5c471bf756814053e847c10f3eb003417bc523d30
  - name: poppler-data
    buildsystem: cmake-ninja
    sources:
      - type: archive
        url: https://poppler.freedesktop.org/poppler-data-0.4.12.tar.gz
        sha256: c835b640a40ce357e1b83666aabd95edffa24ddddd49b8daff63adb851cdab74
  - name: poppler
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DENABLE_UTILS=ON
      - -DENABLE_CPP=OFF
      - -DENABLE_GLIB=OFF
      - -DENABLE_GOBJECT_INTROSPECTION=OFF
      - -DENABLE_QT5=OFF
      - -DENABLE_QT6=OFF
      - -DENABLE_BOOST=OFF
      - -DENABLE_LIBCURL=OFF
      - -DENABLE_LIBOPENJPEG=ON
      - -DENABLE_NSS3=OFF
      - -DENABLE_GPGME=OFF
      - -DBUILD_GTK_TESTS=OFF
      - -DBUILD_QT5_TESTS=OFF
      - -DBUILD_QT6_TESTS=OFF
      - -DBUILD_CPP_TESTS=OFF
      - -DBUILD_MANUAL_TESTS=OFF
    cleanup:
      - /include
      - /lib/pkgconfig
      - /share/man
      - /bin/pdfattach
      - /bin/pdfdetach
      - /bin/pdffonts
      - /bin/pdfseparate
      - /bin/pdfsig
      - /bin/pdftocairo
      - /bin/pdftops
      - /bin/pdfunite
    sources:
      - type: archive
        url: https://poppler.freedesktop.org/poppler-26.11.0.tar.xz
        sha256: 41c32680160addf5a8dd7a830e4869c01e9f6bee1abb91e44fabd1ba9d7828fb
  - name: moose
    buildsystem: meson
    config-opts:
      - -Dgui=true
      - -Dcargo_profile=release
      - --buildtype=release
    post-install:
      - install -Dm644 /run/build/moose/LICENSE /app/share/licenses/io.github.moooossee.Moose/LICENSE
      - install -Dm644 /run/build/moose/cargo/vendor/latex-rust-1.0.4/LICENSE-MIT /app/share/licenses/io.github.moooossee.Moose/latex-rust/LICENSE-MIT
      - install -Dm644 /run/build/moose/cargo/vendor/latex-rust-1.0.4/NOTICE /app/share/licenses/io.github.moooossee.Moose/latex-rust/NOTICE
      - install -Dm644 /run/build/moose/cargo/vendor/latex-rust-1.0.4/fonts/stix-two-math/OFL.txt /app/share/licenses/io.github.moooossee.Moose/latex-rust/fonts/stix-two-math/OFL.txt
      - install -Dm644 /run/build/moose/cargo/vendor/ttf-parser-0.25.1/LICENSE-MIT /app/share/licenses/io.github.moooossee.Moose/ttf-parser/LICENSE-MIT
    sources:
      - type: dir
        path: .
      - cargo-sources.json
