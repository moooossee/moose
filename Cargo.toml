[package]
name = "moose"
version = "0.2.1"
edition = "2024"
rust-version = "1.92"
repository = "https://github.com/moooossee/moose"
homepage = "https://github.com/moooossee/moose"
license = "GPL-3.0-or-later"

[features]
default = []
gui = ["dep:adw", "dep:gtk"]

[[bin]]
name = "moose"
path = "src/main.rs"

[[bin]]
name = "moose-gui"
path = "src/bin/moose-gui.rs"
required-features = ["gui"]

[dependencies]
adw = { package = "libadwaita", version = "0.9.1", features = ["v1_9", "gtk_v4_22"], optional = true }
futures-util = "0.3.32"
gtk = { package = "gtk4", version = "0.11.3", features = ["gnome_50"], optional = true }
libc = "0.2.186"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = "0.37.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.11.0"
tar = { version = "0.4.46", default-features = false }
thiserror = "2.0.17"
time = { version = "0.3.44", features = ["formatting"] }
tokio = { version = "1.48.0", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
url = "2.5.7"
uuid = { version = "1.18.1", features = ["rng", "v7"] }
zstd = { version = "0.13.3", default-features = false }
